<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Aggiungilo al promemoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 380px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
  }
  .bell-circle {
    width: 68px;
    height: 68px;
    border-radius: 22px;
    background: rgba(247, 178, 59, 0.14);
    border: 1.5px solid rgba(247, 178, 59, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-family: "Fredoka", -apple-system, sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.1;
    color: #ffffff;
  }
  .sub {
    font-size: 16.5px;
    font-weight: 700;
    line-height: 1.38;
    color: #a1a1aa;
    margin-top: -8px;
  }
  .sub b {
    color: #f7b23b;
  }
  .btn-main {
    width: 100%;
    border: none;
    cursor: pointer;
    background: #f7b23b;
    color: #111111;
    font-family: "Fredoka", -apple-system, sans-serif;
    font-size: 20px;
    font-weight: 700;
    padding: 18px 22px;
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(247, 178, 59, 0.28);
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .btn-main:active {
    transform: scale(0.97);
  }
  .btn-main.fatto {
    background: #1fc7b6;
    color: #04241f;
    box-shadow: 0 8px 28px rgba(31, 199, 182, 0.28);
  }
  .hint {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    color: #a1a1aa;
  }
  .hint b {
    color: #ffffff;
  }
  .now-link {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 700;
    color: #71717a;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="bell-circle" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f7b23b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </div>

    <h1>Aggiungilo al promemoria</h1>
    <p class="sub">Così il telefono ti avvisa da solo <b id="quando-txt">domani alle 15:00</b>.</p>

    <button type="button" class="btn-main" id="btn-promemoria">
      Aggiungi al promemoria
    </button>

    <p class="hint" id="hint-txt">
      Tocca il pulsante e premi <b>«Aggiungi»</b> in alto a destra.
    </p>

    <a class="now-link" href="https://coinquilini.github.io/?da=serata">Oppure apri il form adesso (2 min) →</a>
  </main>

<script>
(function () {
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycby1qs01PSUihFugALWZBwwJSj_3lOkM2r6cEjR5CwZFmLYo_dscThdS4uAnLyDoOaHK/exec';
  var LINK_SONDAGGIO = 'https://coinquilini.github.io/?da=serata';
  var ua = navigator.userAgent || '';
  var isAndroid = /android/i.test(ua);
  var isIOSNonSafari = /iPad|iPhone|iPod/.test(ua) && /CriOS|FxiOS|EdgiOS/i.test(ua);
  var useGoogleCal = isAndroid || isIOSNonSafari;

  function calcolaTarget() {
    var ora = new Date();
    var target = new Date(ora.getFullYear(), ora.getMonth(), ora.getDate(), 15, 0, 0, 0);
    var postMezzanotte = ora.getHours() < 6;
    if (!postMezzanotte) {
      target.setDate(target.getDate() + 1);
    }
    return { start: target, oggiPomeriggio: postMezzanotte };
  }

  var info = calcolaTarget();
  if (info.oggiPomeriggio) {
    document.getElementById('quando-txt').textContent = 'oggi alle 15:00';
  }

  if (useGoogleCal) {
    document.getElementById('hint-txt').innerHTML =
      'Tocca il pulsante e premi <b>«Salva»</b> in alto a destra.';
  }

  function toICSDateUTC(d) {
    return d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  }

  function foldICS(line) {
    var chars = Array.from(line);
    if (chars.length <= 55) return line;
    var out = chars.slice(0, 55).join('');
    for (var i = 55; i < chars.length; i += 54) {
      out += '\r\n ' + chars.slice(i, i + 54).join('');
    }
    return out;
  }

  function conta(evento, etichetta) {
    if (!ENDPOINT) return;
    try {
      fetch(ENDPOINT, {
        method: 'POST',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          tipo: 'evento',
          evento: evento,
          da: etichetta,
          giorno: new Date().toISOString().slice(0, 10)
        })
      }).catch(function () {});
    } catch (e) {}
  }

  (function () {
    var k = 'serata_qr_aperto';
    try {
      if (sessionStorage.getItem(k)) return;
      sessionStorage.setItem(k, '1');
    } catch (e) {}
    conta('apertura', 'qr-serata');
  })();

  document.getElementById('btn-promemoria').addEventListener('click', function (e) {
    e.preventDefault();
    var t = calcolaTarget();
    var start = t.start;
    var end = new Date(start.getTime() + 15 * 60 * 1000);

    var titolo = 'Ciao! Sono Lorenzo, il ragazzo di ieri sera 👋';
    var testo = 'Ti ricordi il form da 2 minuti sull\'app per coinquilini di cui parlavamo ieri sera?\n\n' +
                'Dimmi che ne pensi qui:\n' + LINK_SONDAGGIO + '\n\n' +
                'E se ti va condividilo a tutti i tuoi amici e coinquilini!';

    if (useGoogleCal) {
      var gcalUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
        '&text=' + encodeURIComponent(titolo) +
        '&dates=' + toICSDateUTC(start) + '/' + toICSDateUTC(end) +
        '&details=' + encodeURIComponent(testo);
      window.open(gcalUrl, '_blank');
    } else {
      var descICS = 'Ti ricordi il form da 2 minuti sull\'app per coinquilini di cui parlavamo ieri sera?\\n\\n' +
                    'Dimmi che ne pensi qui:\\n' + LINK_SONDAGGIO + '\\n\\n' +
                    'E se ti va\\, condividilo a tutti i tuoi amici e coinquilini!';
      var lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Coinquilini//Promemoria//IT',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        'UID:serata-' + Date.now() + '@coinquilini.github.io',
        'DTSTAMP:' + toICSDateUTC(new Date()),
        'DTSTART:' + toICSDateUTC(start),
        'DTEND:' + toICSDateUTC(end),
        foldICS('SUMMARY:' + titolo.replace(/,/g, '\\,')),
        'URL:' + LINK_SONDAGGIO,
        foldICS('DESCRIPTION:' + descICS),
        'BEGIN:VALARM',
        'TRIGGER:PT0S',
        'ACTION:DISPLAY',
        foldICS('DESCRIPTION:Ciao! Sono Lorenzo\\, il ragazzo di ieri sera: ecco il form da 2 min!'),
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ];
      var icsContent = lines.join('\r\n');
      var dataUrl = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsContent);
      var save = document.createElementNS('http://www.w3.org/1999/xhtml', 'a');
      save.rel = 'noopener';
      save.href = dataUrl;
      save.target = '_self';
      save.download = 'promemoria.ics';
      var evt = new MouseEvent('click', { view: window, button: 0, bubbles: true, cancelable: false });
      save.dispatchEvent(evt);
    }

    var btn = document.getElementById('btn-promemoria');
    btn.classList.add('fatto');
    btn.textContent = useGoogleCal ? 'Ora premi «Salva» in alto!' : 'Ora premi «Aggiungi» in alto!';
    conta('copia_link', 'promemoria-serata');
  });
})();
</script>
</body>
</html>
